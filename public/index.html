<style>
  :root {

  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;

    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 48px;
  }

  a { color: inherit; }

  /* ---------- Header ---------- */

  header.hero {
    position: relative;
    padding: 28px 20px 20px;
    max-width: 640px;
    margin: 0 auto;
  }

  header.hero h1 {
    font-family: Georgia, "Iowan Old Style", "Noto Serif SC", serif;
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 6px;
    padding-right: 108px;
    letter-spacing: 0.02em;
  }

  header.hero .subtitle {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }

  .weather {
    position: absolute;
    top: 22px;
    right: 16px;
    min-width: 88px;
    padding: 8px 10px 7px;
    border-radius: 10px;
    border: 1.5px dashed var(--stamp);
    color: var(--stamp);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transform: rotate(-4deg);
    background: var(--paper-card);
    text-align: center;
    line-height: 1.15;
  }

  .weather .w-city {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    max-width: 84px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .weather .w-main {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .weather .w-icon { font-size: 1rem; }
  .weather .w-temp { font-family: Georgia, serif; font-size: 1.05rem; font-weight: 700; }

  .weather .w-time {
    font-size: 0.5rem;
    color: var(--ink-soft);
    max-width: 84px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Day tabs ---------- */

  nav.day-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 20px 14px;
    max-width: 640px;
    margin: 0 auto;
    scrollbar-width: none;
  }
  nav.day-tabs::-webkit-scrollbar { display: none; }

  nav.day-tabs button {
    flex: 0 0 auto;
    font: inherit;
    font-size: 0.88rem;
    color: var(--ink);
    background: var(--paper-card);
    border: 1px solid var(--paper-line);
    border-radius: 6px 6px 0 0;
    padding: 8px 14px;
    cursor: pointer;
  }

  nav.day-tabs button.active {
    background: var(--ink);
    color: var(--paper-card);
    border-color: var(--ink);
  }

  nav.day-tabs button:focus-visible {
    outline: 2px solid var(--stamp);
    outline-offset: 2px;
  }

  /* ---------- Day panel ---------- */

  main { max-width: 640px; margin: 0 auto; padding: 0 20px; }

  .day-panel { display: none; }
  .day-panel.active {
    display: block;
    animation: fade-in 0.25s ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    .day-panel.active { animation: none; }
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .day-head {
    background: var(--paper-card);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }

  .day-head h2 {
    font-family: Georgia, "Iowan Old Style", "Noto Serif SC", serif;
    font-size: 1.15rem;
    margin: 0 0 4px;
  }

  .day-head p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  ol.timeline {
    list-style: none;
    margin: 0 0 8px;
    padding: 0 0 0 20px;
    border-left: 2px solid var(--paper-line);
  }

  ol.timeline li {
    position: relative;
    padding: 0 0 26px 58px;
  }

  ol.timeline li:last-child { padding-bottom: 4px; }

  ol.timeline li::before {
    content: '';
    position: absolute;
    left: -7px;
    top: 3px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--tag);
    border: 2px solid var(--paper);
  }

  .t-time {
    position: absolute;
    left: -20px;
    top: -1px;
    width: 60px;
    text-align: right;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--stamp);
    transform: translateX(-100%);

  .t-title {
    margin: 0 0 3px;
    font-weight: 600;
    font-size: 0.98rem;
  }

  .t-note {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.87rem;
  }

  .empty-note {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.88rem;
    padding: 2px 0 16px 4px;
    margin: 0;
  }

  footer {
    max-width: 640px;
    margin: 32px auto 0;
    padding: 14px 20px 0;
    border-top: 1px dashed var(--paper-line);
    color: var(--ink-soft);
    font-size: 0.78rem;
    text-align: center;
  }
</style>
</head>

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function renderHeader() {
  document.getElementById('tripTitle').textContent = CONFIG.title;
  document.getElementById('tripSubtitle').textContent = CONFIG.subtitle;
  document.title = CONFIG.title;
}

// 每一天沿用最近一次出现的 location，没写就往前找
function resolveLocations() {
  let last = CONFIG.defaultLocation || null;
  return CONFIG.days.map((day) => {
    if (day.location) last = day.location;
    return last;
  });
}

let dayLocations = [];

function renderDays() {
  const tabsWrap = document.getElementById('dayTabs');
  const panelsWrap = document.getElementById('dayPanels');
  tabsWrap.innerHTML = '';
  panelsWrap.innerHTML = '';

  CONFIG.days.forEach((day, i) => {
    const tab = el('button', null, day.label);
    tab.type = 'button';
    tab.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    if (i === 0) tab.classList.add('active');
    tab.addEventListener('click', () => showDay(i));
    tabsWrap.appendChild(tab);

    const panel = el('section', 'day-panel');
    panel.dataset.index = i;
    if (i === 0) panel.classList.add('active');

    const head = el('div', 'day-head');
    head.appendChild(el('h2', null, day.label + ' · ' + day.date));
    head.appendChild(el('p', null, day.note || ''));
    panel.appendChild(head);

    if (day.stops && day.stops.length) {
      const list = el('ol', 'timeline');
      day.stops.forEach((stop) => {
        const li = el('li');
        li.appendChild(el('span', 't-time', stop.time || ''));
        const body = el('div', 't-body');
        body.appendChild(el('p', 't-title', stop.title));
        if (stop.note) body.appendChild(el('p', 't-note', stop.note));
        li.appendChild(body);
        list.appendChild(li);
      });
      panel.appendChild(list);
    } else {
      panel.appendChild(el('p', 'empty-note', '行程细节还没定，到时候再更新'));
    }

    panelsWrap.appendChild(panel);
  });
}

function showDay(index) {
  document.querySelectorAll('.day-tabs button').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
    btn.setAttribute('aria-selected', i === index ? 'true' : 'false');
  });
  document.querySelectorAll('.day-panel').forEach((panel) => {
    panel.classList.toggle('active', Number(panel.dataset.index) === index);
  });
  updateWeatherFor(index);
}

/* ============ 当地实时天气：Open-Meteo，免费、不用注册 ============ */

function codeToEmoji(code) {
  if (code === 0) return '☀️';
  if ([1, 2, 3].includes(code)) return '⛅';
  if ([45, 48].includes(code)) return '🌫️';
  if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return '🌧️';
  if ([71, 73, 75, 77, 85, 86].includes(code)) return '🌨️';
  if ([95, 96, 99].includes(code)) return '⛈️';
  return '🌤️';
}

function paintWeather(city, temp, code, when, stale) {
  document.getElementById('weatherCity').textContent = city || '--';
  document.getElementById('weatherTemp').textContent = (temp != null) ? Math.round(temp) + '°' : '--°';
  document.getElementById('weatherIcon').textContent = (code != null) ? codeToEmoji(code) : '🌤️';
  document.getElementById('weatherTime').textContent = when ? ((stale ? '离线·' : '') + when) : '暂无数据';
}

async function updateWeatherFor(index) {
  const loc = dayLocations[index];
  if (!loc) return;
  const cacheKey = 'weather:' + loc.name;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat +
      '&longitude=' + loc.lon + '&current_weather=true';
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    const cw = data.current_weather;
    const stamp = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    paintWeather(loc.name, cw.temperature, cw.weathercode, stamp, false);
    localStorage.setItem(cacheKey, JSON.stringify({ temp: cw.temperature, code: cw.weathercode, time: stamp }));
  } catch (err) {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const w = JSON.parse(cached);
      paintWeather(loc.name, w.temp, w.code, w.time, true);
    } else {
      paintWeather(loc.name, null, null, null, true);
    }
  }
}

/* ============ 离线支持：注册 Service Worker ============ */

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => { /* 忽略注册失败，不影响页面本身 */ });
  });
}

renderHeader();
renderDays();
dayLocations = resolveLocations();
updateWeatherFor(0);
</script>
</body>
